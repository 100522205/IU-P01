<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis favoritos - Mochileros por el Oeste</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/styles_favoritos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/favoritos.js" type="module"></script>
</head>
<body>

    <header>
        <div class="header_izq izq titulo">Mochileros por el Oeste</div>
        <nav class="navbar">
            <a href="page3.html">Inicio</a>
            <a href="#">Experiencias</a>
            <a href="#">Consejos</a>
            <a href="#">Foro</a>
            <a href="#">Contacto</a>
        </nav>
        <div class="header_dcha">
            <img src="images/diligencia.png" alt="logo" class="logo">
            <form>
                <label class="ninguna">Idioma:</label>
                <select name="language" id="language">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
            </form>
        </div>
    </header>

    <main class="favorites-main">

        <div class="breadcrumbs">
            <a href="page3.html">Home</a> &gt;
            <span>Mis Favoritos</span>
        </div>

        <section class="favorites-panel">
            <h1>Mis Favoritos</h1>

            <div class="favorites-grid" aria-live="polite">
            </div>

            <p class="favorites-empty hidden">
                Todavía no tienes destinos favoritos.  
                Vuelve a la página principal y marca algunos con el corazón ❤.
            </p>
        </section>

    </main>

    <footer>
        <div class="footer_left">
            <div class="izq_negro">@ 2025 Mochileros por el Oeste</div>
            <div class="centro navbar">
                <a href="#">Sobre nosotros.</a>
                <a href="#">Política de privacidad.</a>
                <a href="#">Ayuda</a>
            </div>
        </div>
        <div class="footer_right">
            <div class="redes">
                <i class="fa fa-youtube-play"></i>
                <i class="fa fa-instagram"></i>
                <i class="fa fa-twitter"></i>
            </div>
          
            <form class="subscribe_form">
                <div class="subs">       
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                </div>
                <div>
                    <input type="submit" id="Subs" name="Subscribe" value="Subscribe" class="subscribe_button">
                </div>          
            </form> 
        </div>          
    </footer>

</body>
</html>
