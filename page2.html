<!DOCTYPE html>
<html lang="es">
<head>
    <title>Página 2</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <div class="header_izq izq titulo">Mochileros por el Oeste</div>
        <nav class="navbar">
            <a href="page1.html">Inicio</a>
            <a href="#">Experiencias</a>
            <a href="#">Consejos</a>
            <a href="#">Foro</a>
            <a href="#">Contacto</a>
        </nav>
        <div class="header_dcha">
            <img src="diligencia.png" alt="Logo" class="logo">
            <form>
                <select id="language" name="language">
                <option value="es">ES</option>
                <option value="en">EN</option>
                </select>
            </form>
        </div>
    </header>
    
    
    <main>
        <form>
            <h1>Registro de nuevos usuarios</h1>
            <div>
                <input type="text" name="Nombre" placeholder="Nombre">
                <input type="text" name="Apellidos" placeholder="Apellidos">
            </div>
            <div>
                <input type="text" name="Correo" placeholder="Correo eléctronico">
                <input type="text" name="Confirmar" placeholder="Confirmar correo">
            </div>
            <div>
                <p>Fecha de nacimiento</p>
                <input type="text" name="Birthday" placeholder="DD/MM/YYYY">
            </div>
            <div>
                <input type="text" name="login" placeholder="login">
                <input type="text" name="password" placeholder="password">
            </div>
            <div>
                <p>Subir imagen de perfil</p>
                <input type="button" id="Examinar" name="Examinar" value="Examinar...">
            </div>
            <div>
            <div>
                <input type="checkbox" id="Política" name="Política">
                <label for="Política"> Acepto la <a href="#">Política de privacidad</a></label>
            </div>
            </div>
            <div>
                <a class="button" href="page3.html">Guardar datos y acceder</a>
            </div>

        </form>
    </main>
    
    
    <footer>
        <div class="izq_negro">@ 2025 Mochileros por el Oeste</div>
        <div class="centro navbar">
            <a href="#">Sobre nosotros.</a>
            <a href="#">Política de privacidad.</a>
            <a href="#">Ayuda</a>
        </div>
        <div class="redes">
            <i class="fa fa-youtube-play"></i>
            <i class="fa fa-instagram"></i>
            <i class="fa fa-twitter"></i>
        </div>
        <form class="subscribe_form">
            <div class="subs">       
                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
            </div>
            <div>
                <input type="submit" id="Subs" name="Subscribe" value="Subscribe">
            </div>          
        </form>           
    </footer>

</body>

</html>
