<!DOCTYPE html>
<html lang="es">
<head>
    <title>Nueva Reseña - Mochileros por el Oeste</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/styles_reseñas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/logged.js" type="module"></script>
    <script src="js/reseñas.js" defer></script>
</head>
<body>
    
    <header>
        <div class="header_izq izq titulo">Mochileros por el Oeste</div>
        <nav class="navbar nav_header">
            <a href="page1.html">Inicio</a>
            <a href="#">Experiencias</a>
            <a href="#">Consejos</a>
            <a href="#">Foro</a>
            <a href="#">Contacto</a>
        </nav>
        <div class="header_dcha">
            <img src="images/diligencia.png" alt="Logo" class="logo">
            <form>
                <select id="language" name="language">
                <option value="es">ES</option>
                <option value="en">EN</option>
                </select>
            </form>
        </div>
    </header>

    <div class="breadcrumbs" id="review-breadcrumbs"> </div>

    <main class="form-overlay">
        
        <div class="review-card-form">
            <h1>Nueva Reseña</h1>
            
            <h3 id="city-target-name">Ciudad</h3>

            <div class="star-rating">
                <i class="fa fa-star-o star" data-value="1"></i>
                <i class="fa fa-star-o star" data-value="2"></i>
                <i class="fa fa-star-o star" data-value="3"></i>
                <i class="fa fa-star-o star" data-value="4"></i>
                <i class="fa fa-star-o star" data-value="5"></i>
            </div>
            
            <textarea id="review-text" placeholder="Escribe aquí tu reseña..."></textarea>
            
            <div class="form-actions">
                <button id="btn-submit" class="action-btn">Enviar reseña</button>
                <button id="btn-cancel" class="action-btn">Cancelar</button>
            </div>
        </div>

    </main>
    
    <footer>
        <div class="footer_left">
            <div class="izq_negro">@ 2025 Mochileros por el Oeste</div>
            <div class="centro navbar">
                <a href="#">Sobre nosotros.</a>
                <a href="#">Política de privacidad.</a>
                <a href="#">Ayuda</a>
            </div>
        </div>
        <div class="footer_right">
            <div class="redes">
                <i class="fa fa-youtube-play"></i>
                <i class="fa fa-instagram"></i>
                <i class="fa fa-twitter"></i>
            </div>
          
            <form class="subscribe_form">
                <div class="subs">       
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                </div>
                <div>
                    <input type="submit" id="Subs" name="Subscribe" value="Subscribe" class="subscribe_button">
                </div>          
            </form> 
        </div>          
    </footer>

</body>
</html>
